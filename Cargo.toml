[package]
name = "epoch-envelope"
version = "0.1.0"
edition = "2024"
description = "Fail-closed audits for epoch-bound reliability and resource envelopes"
license = "MIT"
repository = "https://github.com/nicholas-ruest/epoch-envelope"
readme = "README.md"
keywords = ["reliability", "audit", "dag", "quantum", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["std", "serde"] }
clap = { version = "4.5.49", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
toml = "0.9.8"
